[package]
name = "purecrm"
version = "1.2.0"
description = "A local-first CRM for small businesses"
authors = ["PureCRM"]
edition = "2021"

[lib]
name = "purecrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
